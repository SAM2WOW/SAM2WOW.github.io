<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Photos and animated memories from ARX." />
    <title>Photos — My ARX Space</title>
    <meta name="theme-color" content="#55c9f3" />
    <link rel="canonical" href="https://arxu.gay/photos" />
    <link rel="icon" type="image/webp" href="/assets/windows-live-photo-gallery-logo.webp" />
    <link rel="apple-touch-icon" href="/assets/windows-live-photo-gallery-logo.webp" />
    <link rel="stylesheet" href="/css/base.css?v=20260803-16" />
    <link rel="stylesheet" href="/css/aero-components.css?v=20260803-16" />
    <link rel="stylesheet" href="/css/demo.css?v=20260803-26" />
    <link rel="stylesheet" href="/css/photos.css?v=20260803-6" />
  </head>
  <body>
    <main class="photos-stage">
      <section class="aero-window gallery-window" aria-labelledby="gallery-title">
        <div class="aero-window__titlebar">
          <div class="aero-window__title">
            <img class="gallery-window__icon" src="/assets/windows-live-photo-gallery-logo.webp" alt="" aria-hidden="true" />
            <span id="gallery-title">Windows Photo Gallery</span>
          </div>
          <div class="aero-window__controls" aria-label="Window controls">
            <button class="aero-caption-button" type="button" aria-label="Minimize"></button>
            <button class="aero-caption-button" type="button" aria-label="Maximize"></button>
            <button class="aero-caption-button aero-caption-button--close" type="button" aria-label="Close"></button>
          </div>
        </div>

        <div class="gallery-window__toolbar" aria-label="Photo Gallery toolbar">
          <span>Gallery</span>
          <span class="gallery-window__toolbar-separator" aria-hidden="true"></span>
          <span>Pictures and Videos</span>
        </div>

        <div class="aero-window__body gallery-window__body">
          <section class="gallery-group" aria-labelledby="gallery-2026">
            <h2 id="gallery-2026"><span>2026 - 6 items</span></h2>
            <div class="gallery-grid">
              <figure class="gallery-item gallery-item--video">
                <a class="gallery-item__media" href="/assets/popups/popup-01-animation.gif"><img src="/assets/popups/popup-01-animation.gif" alt="Small blue character dancing on a platform" /></a>
              </figure>
              <figure class="gallery-item gallery-item--video">
                <a class="gallery-item__media" href="/assets/popups/popup-02-astd0w.gif"><img src="/assets/popups/popup-02-astd0w.gif" alt="Costumed character dancing outdoors" /></a>
              </figure>
              <figure class="gallery-item gallery-item--video">
                <a class="gallery-item__media" href="/assets/popups/popup-06-kasane-teto.gif"><img src="/assets/popups/popup-06-kasane-teto.gif" alt="Animated face inside a pear" /></a>
              </figure>
              <figure class="gallery-item gallery-item--photo">
                <a class="gallery-item__media" href="/assets/arx-profile.jpg"><img src="/assets/arx-profile.jpg" alt="ARX profile portrait" /></a>
              </figure>
              <figure class="gallery-item gallery-item--photo gallery-item--wide">
                <a class="gallery-item__media" href="/assets/arx-sushi.png"><img src="/assets/arx-sushi.png" alt="ARX enjoying sushi" /></a>
              </figure>
              <figure class="gallery-item gallery-item--photo">
                <a class="gallery-item__media" href="/assets/audio/candy-candy-cover.jpg"><img src="/assets/audio/candy-candy-cover.jpg" alt="Candy Candy cover art" /></a>
              </figure>
            </div>
          </section>

          <section class="gallery-group" aria-labelledby="gallery-2025">
            <h2 id="gallery-2025"><span>2025 - 10 items</span></h2>
            <div class="gallery-grid">
              <figure class="gallery-item gallery-item--photo gallery-item--wide">
                <a class="gallery-item__media" href="/assets/social-preview.png"><img src="/assets/social-preview.png" alt="Preview of the ARX website" /></a>
              </figure>
              <figure class="gallery-item gallery-item--photo">
                <a class="gallery-item__media" href="/assets/maimai/arx-avatar.jpg"><img src="/assets/maimai/arx-avatar.jpg" alt="ARX maimai avatar" /></a>
              </figure>
              <figure class="gallery-item gallery-item--photo gallery-item--wide">
                <a class="gallery-item__media" href="/assets/web-stamps/silly.jpg"><img src="/assets/web-stamps/silly.jpg" alt="Silly web stamp" /></a>
              </figure>
              <figure class="gallery-item gallery-item--photo">
                <a class="gallery-item__media" href="/assets/web-stamps/rgd9okc.jpg"><img src="/assets/web-stamps/rgd9okc.jpg" alt="Retro web stamp" /></a>
              </figure>
              <figure class="gallery-item gallery-item--photo">
                <a class="gallery-item__media" href="/assets/web-stamps/y2k-pbbaqr-8.jpg"><img src="/assets/web-stamps/y2k-pbbaqr-8.jpg" alt="Y2K web stamp" /></a>
              </figure>
              <figure class="gallery-item gallery-item--video">
                <a class="gallery-item__media" href="/assets/popups/popup-03-butt.gif"><img src="/assets/popups/popup-03-butt.gif" alt="Blue animated character against a circular background" /></a>
              </figure>
              <figure class="gallery-item gallery-item--video">
                <a class="gallery-item__media" href="/assets/popups/popup-04-ezgif.gif"><img src="/assets/popups/popup-04-ezgif.gif" alt="Blue costumed character animation" /></a>
              </figure>
              <figure class="gallery-item gallery-item--video">
                <a class="gallery-item__media" href="/assets/popups/popup-05-look-at-me.gif"><img src="/assets/popups/popup-05-look-at-me.gif" alt="Close-up blue animated character" /></a>
              </figure>
              <figure class="gallery-item gallery-item--video">
                <a class="gallery-item__media" href="/assets/web-stamps/dancing-kitty-cat.gif"><img src="/assets/web-stamps/dancing-kitty-cat.gif" alt="Dancing cat animation" /></a>
              </figure>
              <figure class="gallery-item gallery-item--video">
                <a class="gallery-item__media" href="/assets/web-stamps/weekender-girl-remix.gif"><img src="/assets/web-stamps/weekender-girl-remix.gif" alt="Weekender Girl remix animation" /></a>
              </figure>
            </div>
          </section>
        </div>
      </section>

      <nav class="profile-nav" aria-label="Primary navigation">
        <a class="profile-nav__button" href="https://arxu.gay/">Home</a>
        <a class="profile-nav__button" href="/photos" aria-current="page">Photos</a>
        <button class="profile-nav__button" type="button" disabled>Blogs</button>
      </nav>
    </main>
  </body>
</html>
