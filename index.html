<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A tiny collection of reusable Frutiger Aero and Windows 7-inspired CSS components."
    />
    <title>My ARX Space</title>
    <meta name="application-name" content="My ARX Space" />
    <meta property="og:title" content="My ARX Space" />
    <link rel="icon" type="image/jpeg" href="assets/arx-profile.jpg" />
    <link rel="apple-touch-icon" href="assets/arx-profile.jpg" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/aero-components.css" />
    <link rel="stylesheet" href="css/demo.css" />
    <script src="js/button-marquee.js" defer></script>
  </head>
  <body>
    <main class="profile-stage">
      <section class="aero-window msn-window" aria-labelledby="profile-name">
        <div class="aero-window__titlebar">
          <div class="aero-window__title">
            <img class="aero-window__app-icon" src="assets/msn-messenger-logo.png" alt="" aria-hidden="true" />
            <span>ARX Messenger</span>
          </div>
          <div class="aero-window__controls" aria-label="Window controls">
            <button class="aero-caption-button" type="button" aria-label="Minimize"></button>
            <button class="aero-caption-button" type="button" aria-label="Maximize"></button>
            <button class="aero-caption-button aero-caption-button--close" type="button" aria-label="Close"></button>
          </div>
        </div>

        <div class="aero-window__body msn-window__body">
          <header class="msn-banner">
            <img class="msn-logo" src="assets/msn-messenger-logo.png" alt="" aria-hidden="true" />
            <span class="msn-banner__text">
              <strong>ARX Messenger</strong>
              <small>your personal space</small>
            </span>
            <span class="msn-banner__sparkle" aria-hidden="true">✦</span>
          </header>

          <div class="msn-profile">
            <div class="msn-profile__sidebar">
              <div class="msn-avatar-wrap" aria-label="Mango wolf profile icon" role="img">
                <div class="msn-avatar">
                  <img src="assets/arx-profile.jpg" alt="" />
                </div>
                <span class="msn-avatar__badge" aria-hidden="true">
                  <img class="pixel-emoji pixel-emoji--badge" src="assets/emoji/mango.png" alt="" />
                </span>
                <span class="msn-avatar__status" title="Online"></span>
              </div>

              <div class="msn-profile-badges" aria-label="ARX profile badges">
                <img src="assets/profile-badges/gay.png" alt="Gay" />
                <img src="assets/profile-badges/he-they.png" alt="He/They" />
                <img src="assets/profile-badges/wolfgender.png" alt="Wolfgender" />
                <img src="assets/profile-badges/overwatch.png" alt="Overwatch" />
              </div>
            </div>

            <div class="msn-identity">
              <p class="msn-presence"><span aria-hidden="true"></span> Online</p>
              <h1 id="profile-name">
                <img class="pixel-emoji pixel-emoji--title" src="assets/emoji/star.png" alt="Glowing star" />
                <strong>ARX</strong>
                <img class="pixel-emoji pixel-emoji--title" src="assets/emoji/mango.png" alt="Mango" />
                <img class="pixel-emoji pixel-emoji--title" src="assets/emoji/warning.png" alt="Warning" />
              </h1>
              <p class="msn-handle">@FluffyArx</p>

              <div class="msn-message">
                <span class="msn-message__label">Personal message</span>
                <p>
                  92% Mango Wolf
                  <img class="pixel-emoji" src="assets/emoji/wolf.png" alt="Wolf" />
                  <img class="pixel-emoji" src="assets/emoji/mango.png" alt="Mango" />
                  /
                  <img class="pixel-emoji pixel-emoji--flag" src="assets/emoji/rainbow-flag.png" alt="Rainbow flag" />
                  <img class="pixel-emoji pixel-emoji--flag" src="assets/emoji/china-flag.png" alt="Flag of China" />
                  / 26<img class="pixel-emoji" src="assets/emoji/adult.png" alt="Adults only" />
                  /
                  <img class="pixel-emoji" src="assets/emoji/speaking.png" alt="Speaking" />
                  <img class="pixel-emoji pixel-emoji--flag" src="assets/emoji/us-outlying-flag.png" alt="Flag of the United States Minor Outlying Islands" />
                  <img class="pixel-emoji pixel-emoji--flag" src="assets/emoji/japan-flag.png" alt="Flag of Japan" />
                  / Welcome to my website
                </p>
              </div>

              <div class="msn-status-line">
                <span class="msn-status-line__icon" aria-hidden="true">✉</span>
                <span>Signed in as <strong>@FluffyArx</strong></span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="web-button-marquee" aria-label="Scrolling retro website buttons">
        <div class="web-button-marquee__track">
          <div class="web-button-marquee__group" data-button-group></div>
          <div class="web-button-marquee__group" data-button-group aria-hidden="true"></div>
        </div>
      </section>

      <div class="pixel-divider-stack" aria-hidden="true">
        <img src="assets/dividers/rainbow-stars.gif" alt="" />
        <img src="assets/dividers/cat.gif" alt="" />
        <img src="assets/dividers/hanging-stars.gif" alt="" />
        <img src="assets/dividers/rainbow-blood.gif" alt="" />
      </div>

      <section class="aero-window status-window" aria-labelledby="status-title">
        <div class="aero-window__titlebar">
          <div class="aero-window__title">
            <span class="aero-window__icon aero-window__icon--green" aria-hidden="true">
              <img class="pixel-emoji pixel-emoji--caption" src="assets/emoji/sushi.png" alt="" />
            </span>
            <span>Website construction</span>
          </div>
          <div class="aero-window__controls" aria-label="Window controls">
            <button class="aero-caption-button" type="button" aria-label="Minimize"></button>
            <button class="aero-caption-button" type="button" aria-label="Maximize"></button>
            <button class="aero-caption-button aero-caption-button--close" type="button" aria-label="Close"></button>
          </div>
        </div>

        <div class="aero-window__body status-window__body">
          <figure class="status-window__picture">
            <img src="assets/arx-sushi.png" alt="Arx being fed a piece of sushi with chopsticks" />
          </figure>

          <div class="status-window__content" role="status">
            <h2 id="status-title">Arx is eating sushi right now!!</h2>
            <p>Constructing the website...</p>

            <div
              class="aero-progress status-window__progress"
              role="progressbar"
              aria-label="Website construction progress"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="67"
            >
              <div class="aero-progress__fill" style="--progress: 67%"></div>
            </div>
            <small>67% complete · please wait warmly</small>
          </div>
        </div>
      </section>

      <aside class="popup-zone" aria-label="Y2K popup animation gallery">
        <figure class="popup-ad popup-ad--1">
          <div class="popup-ad__bar"><span>COOL_GIF.EXE</span><button type="button" aria-label="Close popup">×</button></div>
          <img src="assets/popups/popup-01-animation.gif" alt="Small blue character dancing on a platform" />
          <figcaption>★ DOWNLOAD NOW! ★</figcaption>
        </figure>

        <figure class="popup-ad popup-ad--2">
          <div class="popup-ad__bar"><span>OMG_WOLF!!!</span><button type="button" aria-label="Close popup">×</button></div>
          <img src="assets/popups/popup-02-astd0w.gif" alt="Costumed character dancing outdoors" />
          <figcaption>YOU ARE VISITOR #0067</figcaption>
        </figure>

        <figure class="popup-ad popup-ad--3">
          <div class="popup-ad__bar"><span>HOT_ANIME.GIF</span><button type="button" aria-label="Close popup">×</button></div>
          <img src="assets/popups/popup-03-butt.gif" alt="Blue animated character against a circular graphic background" />
          <figcaption>CLICK 4 MORE!!!</figcaption>
        </figure>

        <figure class="popup-ad popup-ad--4">
          <div class="popup-ad__bar"><span>67_ALERT</span><button type="button" aria-label="Close popup">×</button></div>
          <img src="assets/popups/popup-04-ezgif.gif" alt="Blue costumed character with the caption six seven" />
          <figcaption>SIX SEVEN SIX SEVEN</figcaption>
        </figure>

        <figure class="popup-ad popup-ad--5">
          <div class="popup-ad__bar"><span>LOOK_AT_ME</span><button type="button" aria-label="Close popup">×</button></div>
          <img src="assets/popups/popup-05-look-at-me.gif" alt="Close-up blue animated character" />
          <figcaption>100% FREE PIXELS</figcaption>
        </figure>

        <figure class="popup-ad popup-ad--6">
          <div class="popup-ad__bar"><span>PEAR_ZONE</span><button type="button" aria-label="Close popup">×</button></div>
          <img src="assets/popups/popup-06-kasane-teto.gif" alt="Animated face inside a pear" />
          <figcaption>ENTER THE PEAR</figcaption>
        </figure>
      </aside>
    </main>
  </body>
</html>
